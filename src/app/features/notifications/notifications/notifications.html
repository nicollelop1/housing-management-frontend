<div class="notifications-page">

    <div class="page-header">
        <div>
            <h1>Notificaciones</h1>
            <p>Revisa toda tu actividad reciente</p>
        </div>

        <button class="btn-mark-all" (click)="markAllAsRead()" *ngIf="!loading && getUnreadCount() > 0">
            <i class='bx bx-check-double'></i>
            Marcar todas como leídas ({{ getUnreadCount() }})
        </button>
    </div>

    <div class="loading-container" *ngIf="loading">
        <div class="loader"></div>
        <p>Cargando notificaciones...</p>
    </div>

    <div class="empty-state" *ngIf="!loading && notifications.length === 0">
        <i class='bx bx-bell-off'></i>
        <h3>No tienes notificaciones</h3>
        <p>Las nuevas actividades aparecerán aquí</p>
    </div>

    <div class="notifications-list" *ngIf="!loading && notifications.length > 0">
        <div class="notification-card" *ngFor="let notification of notifications" [class.unread]="!notification.read"
            (click)="openNotification(notification)">

            <div class="notif-icon" [ngClass]="'notif-' + notification.type.toLowerCase()">
                <i class="bx" [ngClass]="notifIcon(notification.type)"></i>
            </div>

            <div class="notif-content">
                <div class="notif-top">
                    <span class="notif-type">
                        {{ notifType(notification.type) }}
                    </span>
                    <span class="notif-time">
                        {{ timeAgo(notification.createdAt) }}
                    </span>
                </div>

                <h3>{{ notification.title }}</h3>
                <p>{{ notification.message }}</p>
            </div>

            <div class="notif-dot" *ngIf="!notification.read"></div>
        </div>
    </div>

</div>
