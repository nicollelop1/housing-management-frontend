<div class="forgot-wrapper">

  <div class="overlay"></div>

  <div class="forgot-box">

    <i class="bx bx-arrow-back icon-back" (click)="goBack()"></i>

    <h2>Restablecer contraseña</h2>

    <p class="subtitle">
      Ingresa tu correo y te enviaremos un código de verificación
    </p>

    <form #form="ngForm" (ngSubmit)="onSubmit(form)">

      <div class="input-box">
        <input
          type="email"
          class="input-field"
          [(ngModel)]="email"
          name="email"
          #emailRef="ngModel"
          required
          placeholder=" "
        />

        <p *ngIf="emailRef.errors?.['required'] && emailRef.touched" class="error-text">
          Este campo es obligatorio
        </p>

        <p *ngIf="!isEmailValid() && emailRef.touched && !emailRef.errors?.['required']" class="error-text">
          Email inválido (ej: correo@gmail.com)
        </p>

        <label>Email</label>
      </div>

      <button type="submit">
        Enviar código
      </button>

      <p *ngIf="errorMessage" class="error-text">
        {{ errorMessage }}
      </p>

    </form>

  </div>

</div>
