<div class="login-wrapper">
    <div class="overlay"></div>

    <div class="login-box">
        <i class="bx bx-arrow-back icon-back" (click)="goBack()"></i>

        <h2>Iniciar Sesión</h2>

        <form #form="ngForm" (ngSubmit)="onSubmit(form)">
            <div class="input-box">
                <input type="email" class="input-field" [(ngModel)]="email" name="email" #emailRef="ngModel" required
                    placeholder=" ">
                <p *ngIf="emailRef.touched && !isEmailValid()" class="error-text">
                    Email inválido (ej: correo@gmail.com)
                </p>
                <i class="bx bx-envelope icon"></i>
                <label>Email</label>
            </div>

            <div class="input-box">
                <input type="password" class="input-field" [(ngModel)]="password" name="password" #passwordRef="ngModel"
                    required minlength="8" placeholder=" ">
                <p *ngIf="passwordRef.invalid && passwordRef.touched" class="error-text">
                    Minimo 8 caracteres
                </p>

                <i class="bx bx-lock icon"></i>
                <label>Contraseña</label>
            </div>

            <div class="password-forgot">
                <a routerLink="/forgot-password" >¿Olvidaste tu contraseña?</a>
            </div>

            <button type="submit" class="btn-submit">
                <span class="btn-text">Ingresar</span>
                <i class="bx bx-arrow-from-left btn-icon"></i>
            </button>

            <div class="register-text">
                No tienes cuenta? <a routerLink="/register">Regístrate</a>
            </div>

        </form>
    </div>
</div>
