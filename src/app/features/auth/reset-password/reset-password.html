<div class="reset-wrapper">
  <div class="overlay"></div>

  <div class="reset-box">

    <i class="bx bx-arrow-back icon-back" (click)="goBack()"></i>

    <h2>Nueva contraseña</h2>
    <p class="subtitle">Crea una contraseña segura para tu cuenta</p>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">

      <div class="input-box">
        <input type="password" class="input-field" formControlName="password" placeholder=" "
          [class.input-error]="password.invalid && password.touched" />
        <label>Nueva contraseña</label>
        <p *ngIf="password.touched && password.hasError('required')" class="error-text">
          Este campo es obligatorio
        </p>
      </div>

      <div class="password-requirements" *ngIf="password.value">
        <p class="req-title">Requisitos mínimos:</p>
        <div class="req-item" [class.req-ok]="hasMinLength" [class.req-fail]="!hasMinLength">
          <i class="bx" [class.bx-check]="hasMinLength" [class.bx-x]="!hasMinLength"></i>
          Mínimo 8 caracteres
        </div>
        <div class="req-item" [class.req-ok]="hasUpperCase" [class.req-fail]="!hasUpperCase">
          <i class="bx" [class.bx-check]="hasUpperCase" [class.bx-x]="!hasUpperCase"></i>
          Al menos una mayúscula
        </div>
        <div class="req-item" [class.req-ok]="hasNumber" [class.req-fail]="!hasNumber">
          <i class="bx" [class.bx-check]="hasNumber" [class.bx-x]="!hasNumber"></i>
          Al menos un número
        </div>
        <div class="req-item" [class.req-ok]="hasSymbol" [class.req-fail]="!hasSymbol">
          <i class="bx" [class.bx-check]="hasSymbol" [class.bx-x]="!hasSymbol"></i>
          Al menos un símbolo (&#64; $ ! % * ? &amp;)
        </div>
      </div>

      <button type="submit" [disabled]="loading">
        {{ loading ? 'Guardando...' : 'Restablecer contraseña' }}
      </button>

    </form>
  </div>
</div>
