<div class="prop-form-page">
    <div class="form-header">
        <h1><i class='bx bx-plus-circle'></i> Nueva propiedad</h1>
        <p>Completa los datos para publicar tu propiedad.</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="prop-form" novalidate>

        <div class="form-section">
            <h2 class="section-title">Información básica</h2>
            <div class="field col-full">
                <label>Título <span class="req">*</span></label>
                <input formControlName="title" type="text" placeholder="Ej: Apartamento moderno en el centro">
                <span class="err" *ngIf="form.get('title')!.touched && form.get('title')!.invalid">
                    El título es obligatorio (3–200 caracteres)
                </span>
            </div>
            <div class="field col-full">
                <label>Descripción</label>
                <textarea formControlName="description" rows="4" placeholder="Describe la propiedad..."></textarea>
            </div>
            <div class="field-row">
                <div class="field">
                    <label>Tipo de transacción <span class="req">*</span></label>
                    <select formControlName="transactionType">
                        <option value="RENT">Arriendo</option>
                        <option value="SALE">Venta</option>
                    </select>
                </div>
                <div class="field">
                    <label>Tipo de propiedad <span class="req">*</span></label>
                    <select formControlName="typeProperty">
                        <option value="APARTMENT">Apartamento</option>
                        <option value="HOUSE">Casa</option>
                        <option value="ROOM">Habitación</option>
                        <option value="STUDIO">Estudio</option>
                        <option value="OFFICE">Oficina</option>
                        <option value="LAND">Terreno</option>
                    </select>
                </div>
            </div>
            <div class="field-row">
                <div class="field">
                    <label>Precio (COP) <span class="req">*</span></label>
                    <input formControlName="priceAmount" type="number" min="1" placeholder="Ej: 1500000">
                    <span class="err" *ngIf="form.get('priceAmount')!.touched && form.get('priceAmount')!.invalid">
                        Ingresa un precio válido
                    </span>
                </div>
                <div class="field" *ngIf="form.get('transactionType')!.value === 'RENT'">
                    <label>Frecuencia de pago</label>
                    <select formControlName="paymentFrequency">
                        <option value="MONTHLY">Mensual</option>
                        <option value="BIWEEKLY">Quincenal</option>
                        <option value="WEEKLY">Semanal</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="form-section">
            <h2 class="section-title">Características</h2>
            <div class="field-row">
                <div class="field">
                    <label>Habitaciones</label>
                    <input formControlName="numberOfBedrooms" type="number" min="0" placeholder="0">
                </div>
                <div class="field">
                    <label>Baños</label>
                    <input formControlName="numberOfBathrooms" type="number" min="0" placeholder="0">
                </div>
                <div class="field">
                    <label>Área (m²)</label>
                    <input formControlName="areaInSquareMeters" type="number" min="1" placeholder="Ej: 65">
                </div>
            </div>
            <div class="field-row">
                <div class="field">
                    <label>¿Mascotas permitidas?</label>
                    <select formControlName="petsAllowed">
                        <option [ngValue]="false">No</option>
                        <option [ngValue]="true">Sí</option>
                    </select>
                </div>
                <div class="field">
                    <label>¿Amoblado?</label>
                    <select formControlName="furnished">
                        <option [ngValue]="false">No</option>
                        <option [ngValue]="true">Sí</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="form-section">
            <h2 class="section-title">Dirección</h2>
            <div class="field col-full">
                <label>Calle / Dirección <span class="req">*</span></label>
                <input formControlName="street" type="text" placeholder="Ej: Calle 72 #10-34">
            </div>
            <div class="field-row">
                <div class="field">
                    <label>Ciudad <span class="req">*</span></label>
                    <input formControlName="city" type="text" placeholder="Bogotá">
                </div>
                <div class="field">
                    <label>Departamento/Estado <span class="req">*</span></label>
                    <input formControlName="state" type="text" placeholder="Cundinamarca">
                </div>
            </div>
            <div class="field-row">
                <div class="field">
                    <label>País <span class="req">*</span></label>
                    <input formControlName="country" type="text" placeholder="Colombia">
                </div>
                <div class="field">
                    <label>Código postal <span class="req">*</span></label>
                    <input formControlName="postalCode" type="text" placeholder="110111">
                </div>
            </div>
            <div class="field-row">
                <div class="field">
                    <label>Latitud</label>
                    <input type="text" formControlName="latitude" (input)="sanitizeDecimal('latitude', $event)">
                </div>

                <div class="field">
                    <label>Longitud</label>
                    <input type="text" formControlName="longitude" (input)="sanitizeDecimal('longitude', $event)">
                </div>
            </div>
        </div>

        <div class="form-section">
            <h2 class="section-title">Imágenes <span class="req">*</span></h2>

            <label class="upload-area">
                <i class='bx bx-image-add'></i>
                <span>Haz clic para subir imágenes</span>
                <small>JPG, PNG — puedes subir varias</small>
                <input type="file" multiple accept="image/*" (change)="onFilesChange($event)" style="display:none">
            </label>
            <div class="preview-grid" *ngIf="previewUrls.length > 0">
                <div class="preview-item" *ngFor="let url of previewUrls; let i = index">
                    <img [src]="url" alt="preview">
                    <button type="button" class="remove-img" (click)="removeFile(i)">
                        <i class='bx bx-x'></i>
                    </button>
                </div>
            </div>
        </div>

        <div class="form-footer">
            <button type="button" class="btn-cancel" routerLink="/my-properties">Cancelar</button>
            <button type="submit" class="btn-submit" [disabled]="loading">
                {{ loading ? 'Creando...' : 'Crear propiedad' }}
            </button>
        </div>

    </form>
</div>
